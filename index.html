</style></head><body><main><h1>CLUB KISS</h1><div class="muted">LAST ORDER MANAGEMENT</div><section id="loginBox"><h2>ログイン（初回のみ）</h2><p class="muted">スタッフは共通アカウント、管理者は管理者アカウントでログインしてください。ログイン状態は保存されます。</p><div class="row"><button id="staffMode" class="selected">スタッフ</button><button id="adminMode">管理者</button></div><input id="password" type="password" autocomplete="current-password" placeholder="パスワード" style="box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:10px;background:#10182b;border:1px solid #45516c;color:white;font-size:16px"><button id="login" class="wide primary">ログイン</button><p id="loginError" class="muted"></p></section><section id="sessionBox" hidden><div class="row" style="align-items:center"><span id="roleLabel" style="flex:1"></span><button id="logout">ログアウト</button></div></section><div id="orderArea" hidden><div id="staffOrder"><section><h2>① 卓番号</h2><div class="grid" id="tables"></div></section><section><h2>② 担当者を選択</h2><div class="wheel" id="wheel"></div><p class="staff-current">選択中：<strong id="staffName">白</strong></p></section><section><h2>③ 注文品</h2><div id="products"></div></section><section><h2>注文確認</h2><div id="cart"></div><button class="wide primary" id="review">内容確認へ</button></section></div><section id="orderHistorySection"><h2 id="historyTitle">注文履歴</h2><p id="historyNote" class="muted"></p><div id="history"></div></section><section id="adminSettings" hidden><h2>管理者設定</h2><p class="muted">追加・削除は全スタッフの端末に反映されます。過去の注文履歴は残ります。</p><h3>担当者管理</h3><div id="staffManage"></div><div class="row"><input id="newStaff" placeholder="担当者名"><button id="addStaff">追加</button></div><h3>メニュー管理</h3><div id="productManage"></div><div class="row"><input id="newProduct" placeholder="商品名"><button id="addProduct">追加</button></div><p id="settingsStatus" class="muted"></p></section><section><h2>通知設定</h2><p class="muted">注文履歴はFirebaseで端末間共有されます。iPhoneのプッシュ通知は別途設定が必要です。</p><button class="wide" id="notify">通知の許可を確認</button><p id="notifyStatus" class="muted"></p></section></div></main><dialog id="dialog"><h2>送信前の最終確認</h2><pre id="summary"></pre><div class="row"><button id="cancel">戻る</button><button class="primary" id="send">確定して登録</button></div></dialog><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

const app=initializeApp({apiKey:'AIzaSyDrIO42RKi0oyjkXO-z3uH7eJcuLR8_Ils',authDomain:'zaiko-c706e.firebaseapp.com',projectId:'zaiko-c706e',storageBucket:'zaiko-c706e.firebasestorage.app',messagingSenderId:'282569206342',appId:'1:282569206342:web:4d689f2ffc15887b6cb847',measurementId:'G-6CHELZ2FQ8'});
const auth=getAuth(app),db=getFirestore(app);
let isAdmin=false,mode='staff',unsubscribe=null;
const $=id=>document.getElementById(id);
function setMode(v){mode=v;$('staffMode').classList.toggle('selected',v==='staff');$('adminMode').classList.toggle('selected',v==='admin');}
$('staffMode').onclick=()=>setMode('staff');$('adminMode').onclick=()=>setMode('admin');
$('login').onclick=async()=>{const b=$('login');b.disabled=true;$('loginError').textContent='接続中…';try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,mode==='staff'?'kurousagiseira+staff@gmail.com':'kurousagiseira@gmail.com',$('password').value);$('password').value='';$('loginError').textContent=''}catch(e){$('loginError').textContent='ログインできません。パスワードを確認してください（'+e.code+'）'}finally{b.disabled=false}};
$('logout').onclick=()=>signOut(auth);
let unsubSettings=[],sessionOrders=[];
onAuthStateChanged(auth,user=>{
 if(unsubscribe){unsubscribe();unsubscribe=null}
 unsubSettings.forEach(fn=>fn());unsubSettings=[];
 const allowed=['kurousagiseira+staff@gmail.com','kurousagiseira@gmail.com'];
 const ok=!!(user&&allowed.includes(user.email));
 isAdmin=!!(ok&&user.email==='kurousagiseira@gmail.com');
 $('loginBox').hidden=ok;$('sessionBox').hidden=!ok;$('orderArea').hidden=!ok;
 $('adminSettings').hidden=!isAdmin;
 $('staffOrder').hidden=isAdmin;
 $('orderHistorySection').classList.toggle('admin-orders',isAdmin);
 $('roleLabel').textContent=isAdmin?'管理者でログイン中':'スタッフでログイン中';
 $('historyTitle').textContent=isAdmin?'📋 注文管理｜全卓一覧':'この端末で送信した注文';
 $('historyNote').textContent=isAdmin?'未確認の注文を上に表示します。内容を確認したら「確認済みにする」を押してください。':'この端末で送信した注文のみ表示します。';
 history=isAdmin?[]:sessionOrders;drawHistory();
 if(!ok)return;
 if(isAdmin){
  unsubscribe=onSnapshot(query(collection(db,'club_kiss_orders'),orderBy('createdAt','desc')),snapshot=>{
   history=snapshot.docs.filter(d=>d.id!=='setup').map(d=>({id:d.id,...d.data()}));drawHistory();
  },err=>{$('history').textContent='注文を読み込めません：'+err.message});
 }
 for(const [key,fallback,apply] of [
  ['staff', ['白','輝','京磨','ローザ','結希','ハウル','ルパン','しゅう','流川','れもん'], v=>{staff=v;refreshStaff()}],
  ['products',['アンジュエール 白','アンジュエール ロゼ','アンジュエール ゴールド','ビール','コーラ','緑茶','ウーロン茶','テキーラ','コカレロ'],v=>{products=v;drawProducts();drawCart()}]
 ]){
  const stop=onSnapshot(doc(db,'club_kiss_config',key),snap=>{
   const arr=snap.exists()&&Array.isArray(snap.data().items)?snap.data().items:fallback;
   apply(arr);if(isAdmin)drawManagement();
  },err=>{if(isAdmin)$('settingsStatus').textContent='設定の共有にはFirestoreルールの追加が必要です：'+err.code});
  unsubSettings.push(stop);
 }
});
const tables=['2','3','4','5','6','7','8','9','VIP1','VIP2','VIP3'];let staff=['白','輝','京磨','ローザ','結希','ハウル','ルパン','しゅう','流川','れもん'];let products=['アンジュエール 白','アンジュエール ロゼ','アンジュエール ゴールド','ビール','コーラ','緑茶','ウーロン茶','テキーラ','コカレロ'];let table='2',person='白',counts={},history=[];function el(tag,txt,cl){let e=document.createElement(tag);e.textContent=txt;if(cl)e.className=cl;return e}function drawTables(){ $('tables').replaceChildren(...tables.map(t=>{let b=el('button',t,t===table?'selected':'');b.onclick=()=>{table=t;drawTables()};return b}))}drawTables();const wheel=$('wheel');function refreshStaff(){const previous=person;wheel.replaceChildren();staff.forEach((name,i)=>{const item=el('div',name,'staff-option');item.onclick=()=>wheel.scrollTo({top:i*48,behavior:'smooth'});wheel.append(item)});staffIndex=Math.max(0,staff.indexOf(previous));drawStaff();wheel.scrollTop=staffIndex*48}let staffIndex=0;function drawStaff(){person=staff[staffIndex];$('staffName').textContent=person;[...wheel.children].forEach((item,i)=>{item.classList.toggle('active',i===staffIndex);item.setAttribute('aria-selected',i===staffIndex?'true':'false')})}let wheelTimer;wheel.addEventListener('scroll',()=>{const i=Math.max(0,Math.min(staff.length-1,Math.round(wheel.scrollTop/48)));if(i!==staffIndex){staffIndex=i;drawStaff()}clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{const target=staffIndex*48;if(Math.abs(wheel.scrollTop-target)>1)wheel.scrollTo({top:target,behavior:'smooth'})},120)});refreshStaff();function drawProducts(){$('products').replaceChildren(...products.map(p=>{let r=el('div','','product'),name=el('span',p),minus=el('button','−'),n=el('b',String(counts[p]||0),'qty'),plus=el('button','＋');minus.onclick=()=>{counts[p]=Math.max(0,(counts[p]||0)-1);drawProducts();drawCart()};plus.onclick=()=>{counts[p]=(counts[p]||0)+1;drawProducts();drawCart()};r.append(name,minus,n,plus);return r}))}function lines(){return products.filter(p=>counts[p]>0).map(p=>`${p} × ${counts[p]}`)}function drawCart(){$('cart').textContent=lines().join(' / ')||'注文品を選んでください'}function drawHistory(){
 const entries=isAdmin?[...history].sort((a,b)=>Number(!!a.checked)-Number(!!b.checked)):history;
 const root=$('history');root.replaceChildren();
 if(isAdmin){
  const pending=history.filter(o=>!o.checked).length;
  const overview=el('div','','order-overview');
  overview.append(el('div','未確認 '+pending+' 件','order-count'),el('div','全注文 '+history.length+' 件','order-total'));
  root.append(overview);
 }
 for(const o of entries){
  const d=el('article','','order-card'+(o.checked?' done':' pending'));
  const top=el('div','','order-top');
  top.append(el('strong',o.table+'卓','order-table'),el('span',o.checked?'✓ 確認済':'● 未確認','order-status'));
  const person=el('div','担当：'+(o.staff||'不明'),'order-person');
  const items=el('div','','order-items');
  (o.items||[]).forEach(item=>items.append(el('div',item,'order-item')));
  const date=el('div','注文日時：'+(o.date||'日時不明'),'order-date');
  d.append(top,person,items,date);
  if(isAdmin){
   const b=el('button',o.checked?'未確認に戻す':'✓ 確認済みにする',o.checked?'wide':'wide primary');
   b.onclick=async()=>{b.disabled=true;try{await updateDoc(doc(db,'club_kiss_orders',o.id),{checked:!o.checked})}catch(e){alert('変更できません：'+e.message)}finally{b.disabled=false}};
   d.append(b);
  }
  root.append(d);
 }
 if(!entries.length)root.append(el('p','注文はまだありません','muted'));
}
function persist(){drawHistory()}
function drawManagement(){
 for(const [key,arr,target] of [['staff',staff,'staffManage'],['products',products,'productManage']]){
  $(target).replaceChildren(...arr.map(name=>{
   const r=el('div','','manage-row'),label=el('span',name),btn=el('button','削除');
   btn.onclick=async()=>{if(!isAdmin||!confirm(name+' を削除しますか？'))return;await saveConfig(key,arr.filter(v=>v!==name))};
   r.append(label,btn);return r;
  }));
 }
}
async function saveConfig(key,items){
 if(!isAdmin)return;
 try{await setDoc(doc(db,'club_kiss_config',key),{items,updatedAt:serverTimestamp()});$('settingsStatus').textContent='保存しました'}
 catch(e){$('settingsStatus').textContent='保存できません：'+e.message}
}
$('addStaff').onclick=()=>{const v=$('newStaff').value.trim();if(!v||staff.includes(v))return;saveConfig('staff',[...staff,v]);$('newStaff').value=''};
$('addProduct').onclick=()=>{const v=$('newProduct').value.trim();if(!v||products.includes(v))return;saveConfig('products',[...products,v]);$('newProduct').value=''};
drawProducts();drawCart();drawHistory();$('review').onclick=()=>{if(!lines().length){alert('商品を選択してください');return}$('summary').textContent=`卓番号：${table}\n担当：${person}\n\n${lines().join('\n')}`;$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('send').onclick=async()=>{const b=$('send');b.disabled=true;try{const sent={table,staff:person,items:lines(),date:new Date().toLocaleString('ja-JP'),createdAt:serverTimestamp(),checked:false};const ref=await addDoc(collection(db,'club_kiss_orders'),sent);if(!isAdmin){sessionOrders.unshift({...sent,id:ref.id});history=sessionOrders;drawHistory()}counts={};drawProducts();drawCart();$('dialog').close();alert('注文を送信しました')}catch(e){alert('送信に失敗しました：'+e.message)}finally{b.disabled=false}};$('notify').onclick=async()=>{if(!('Notification'in window)){$('notifyStatus').textContent='この環境では通知に対応していません';return}let p=await Notification.requestPermission();$('notifyStatus').textContent=`通知の許可：${p}（プッシュ配信は未設定）`};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
