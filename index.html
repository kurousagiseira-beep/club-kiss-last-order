<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>CLUB KISS | LAST ORDER</title><style>body{margin:0;background:#0b1020;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:540px;margin:auto;padding:22px 16px 80px}h1{margin:0;font-size:26px}.muted{color:#a5afc4;font-size:13px}section{background:#192238;border-radius:18px;padding:16px;margin-top:16px}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{border:1px solid #45516c;background:#27334b;color:white;padding:12px 8px;border-radius:10px;font-size:15px;cursor:pointer}.selected,.primary{background:#2563eb;border-color:#2563eb}.wide{width:100%;margin-top:12px}.wheel{height:144px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:14px;background:#10182b;text-align:center;position:relative;border:1px solid #45516c}.wheel:before,.wheel:after{content:'';display:block;height:48px;pointer-events:none}.wheel .staff-option{height:48px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;color:#8290ab;font-size:18px;transition:color .12s,background .12s,font-weight .12s}.wheel .staff-option.active{color:#93c5fd;background:#213b68;font-weight:800;font-size:24px;border-top:1px solid #3b82f6;border-bottom:1px solid #3b82f6}.wheel .staff-option:not(.active){opacity:.7}.staff-current{margin-top:10px;color:#93c5fd;font-weight:700;font-size:16px}.product{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #39435a;padding:21px 0;min-height:66px}.product span{font-size:20px;line-height:1.4}.product button{font-size:24px;min-width:52px;min-height:52px}.product .qty{font-size:22px}.product span{flex:1}.qty{min-width:22px;text-align:center}dialog{background:#192238;color:white;border:1px solid #56627a;border-radius:18px;max-width:90%;width:400px}pre{white-space:pre-wrap;font:inherit;line-height:1.7}.history{border-bottom:1px solid #39435a;padding:12px 0}.row{display:flex;gap:8px}.row button{flex:1}small{color:#cbd5e1}</style></head><body><main><h1>CLUB KISS</h1><div class="muted">LAST ORDER MANAGEMENT</div><section id="loginBox"><h2>ログイン（初回のみ）</h2><p class="muted">スタッフは共通アカウント、管理者は管理者アカウントでログインしてください。ログイン状態は保存されます。</p><div class="row"><button id="staffMode" class="selected">スタッフ</button><button id="adminMode">管理者</button></div><input id="password" type="password" autocomplete="current-password" placeholder="パスワード" style="box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border-radius:10px;background:#10182b;border:1px solid #45516c;color:white;font-size:16px"><button id="login" class="wide primary">ログイン</button><p id="loginError" class="muted"></p></section><section id="sessionBox" hidden><div class="row" style="align-items:center"><span id="roleLabel" style="flex:1"></span><button id="logout">ログアウト</button></div></section><div id="orderArea" hidden><section><h2>① 卓番号</h2><div class="grid" id="tables"></div></section><section><h2>② 担当者（上下スクロール）</h2><div class="wheel" id="wheel"></div><p class="staff-current">選択中：<strong id="staffName">代表</strong></p></section><section><h2>③ 注文品</h2><div id="products"></div></section><section><h2>注文確認</h2><div id="cart"></div><button class="wide primary" id="review">内容確認へ</button></section><section><h2>注文履歴（リアルタイム共有）</h2><div id="history"></div></section><section><h2>通知設定</h2><p class="muted">注文履歴はFirebaseで端末間共有されます。iPhoneのプッシュ通知は別途設定が必要です。</p><button class="wide" id="notify">通知の許可を確認</button><p id="notifyStatus" class="muted"></p></section></div></main><dialog id="dialog"><h2>送信前の最終確認</h2><pre id="summary"></pre><div class="row"><button id="cancel">戻る</button><button class="primary" id="send">確定して登録</button></div></dialog><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,addDoc,doc,updateDoc,onSnapshot,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyDrIO42RKi0oyjkXO-z3uH7eJcuLR8_Ils',authDomain:'zaiko-c706e.firebaseapp.com',projectId:'zaiko-c706e',storageBucket:'zaiko-c706e.firebasestorage.app',messagingSenderId:'282569206342',appId:'1:282569206342:web:4d689f2ffc15887b6cb847',measurementId:'G-6CHELZ2FQ8'});
const auth=getAuth(app),db=getFirestore(app);
let isAdmin=false,mode='staff',unsubscribe=null;
const $=id=>document.getElementById(id);
function setMode(v){mode=v;$('staffMode').classList.toggle('selected',v==='staff');$('adminMode').classList.toggle('selected',v==='admin');}
$('staffMode').onclick=()=>setMode('staff');$('adminMode').onclick=()=>setMode('admin');
$('login').onclick=async()=>{const b=$('login');b.disabled=true;$('loginError').textContent='接続中…';try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,mode==='staff'?'kurousagiseira+staff@gmail.com':'kurousagiseira@gmail.com',$('password').value);$('password').value='';$('loginError').textContent=''}catch(e){$('loginError').textContent='ログインできません。パスワードを確認してください（'+e.code+'）'}finally{b.disabled=false}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}const allowed=['kurousagiseira+staff@gmail.com','kurousagiseira@gmail.com'];const ok=user&&allowed.includes(user.email);isAdmin=!!(ok&&user.email==='kurousagiseira@gmail.com');$('loginBox').hidden=!!ok;$('sessionBox').hidden=!ok;$('orderArea').hidden=!ok;$('roleLabel').textContent=isAdmin?'管理者でログイン中':'スタッフでログイン中';if(!ok)return;unsubscribe=onSnapshot(query(collection(db,'club_kiss_orders'),orderBy('createdAt','desc')),snapshot=>{history=snapshot.docs.map(d=>({id:d.id,...d.data()}));drawHistory()},err=>{$('history').textContent='注文を読み込めません：'+err.message})});

const tables=['2','3','4','5','6','7','8','9','VIP1','VIP2','VIP3'];const staff=['代表','輝','京磨','ローザ','結希','ハウル','ルパン','しゅう','流川','れもん'];const products=['アンジュエール 白','アンジュエール ロゼ','アンジュエール ゴールド','ビール','コーラ','緑茶','ウーロン茶','テキーラ','コカレロ'];let table='2',person='代表',counts={},history=[];function el(tag,txt,cl){let e=document.createElement(tag);e.textContent=txt;if(cl)e.className=cl;return e}function drawTables(){ $('tables').replaceChildren(...tables.map(t=>{let b=el('button',t,t===table?'selected':'');b.onclick=()=>{table=t;drawTables()};return b}))}drawTables();const wheel=$('wheel');staff.forEach((name,i)=>{const item=el('div',name,'staff-option');item.onclick=()=>wheel.scrollTo({top:i*48,behavior:'smooth'});wheel.append(item)});let staffIndex=0;function drawStaff(){person=staff[staffIndex];$('staffName').textContent=person;[...wheel.children].forEach((item,i)=>{item.classList.toggle('active',i===staffIndex);item.setAttribute('aria-selected',i===staffIndex?'true':'false')})}let wheelTimer;wheel.addEventListener('scroll',()=>{const i=Math.max(0,Math.min(staff.length-1,Math.round(wheel.scrollTop/48)));if(i!==staffIndex){staffIndex=i;drawStaff()}clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{const target=staffIndex*48;if(Math.abs(wheel.scrollTop-target)>1)wheel.scrollTo({top:target,behavior:'smooth'})},120)});drawStaff();function drawProducts(){$('products').replaceChildren(...products.map(p=>{let r=el('div','','product'),name=el('span',p),minus=el('button','−'),n=el('b',String(counts[p]||0),'qty'),plus=el('button','＋');minus.onclick=()=>{counts[p]=Math.max(0,(counts[p]||0)-1);drawProducts();drawCart()};plus.onclick=()=>{counts[p]=(counts[p]||0)+1;drawProducts();drawCart()};r.append(name,minus,n,plus);return r}))}function lines(){return products.filter(p=>counts[p]>0).map(p=>`${p} × ${counts[p]}`)}function drawCart(){$('cart').textContent=lines().join(' / ')||'注文品を選んでください'}function drawHistory(){$('history').replaceChildren(...history.map(o=>{let d=el('div','','history'),head=el('strong',`${o.table}卓｜${o.staff}`),p=el('pre',o.items.join('\n')),date=el('small',o.date),status=el('small',o.checked?'確認済':'未確認'),b=el('button',o.checked?'未確認に戻す':'確認済みにする');b.disabled=!isAdmin;b.onclick=async()=>{if(!isAdmin)return;try{await updateDoc(doc(db,'club_kiss_orders',o.id),{checked:!o.checked})}catch(e){alert('変更できません：'+e.message)}};d.append(head,p,date,document.createElement('br'),status,document.createElement('br'),b);return d}));if(!history.length)$('history').textContent='履歴はありません'}function persist(){drawHistory()}drawProducts();drawCart();drawHistory();$('review').onclick=()=>{if(!lines().length){alert('商品を選択してください');return}$('summary').textContent=`卓番号：${table}\n担当：${person}\n\n${lines().join('\n')}`;$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('send').onclick=async()=>{const b=$('send');b.disabled=true;try{await addDoc(collection(db,'club_kiss_orders'),{table,staff:person,items:lines(),date:new Date().toLocaleString('ja-JP'),createdAt:serverTimestamp(),checked:false});counts={};drawProducts();drawCart();$('dialog').close();alert('注文を送信しました')}catch(e){alert('送信に失敗しました：'+e.message)}finally{b.disabled=false}};$('notify').onclick=async()=>{if(!('Notification'in window)){$('notifyStatus').textContent='この環境では通知に対応していません';return}let p=await Notification.requestPermission();$('notifyStatus').textContent=`通知の許可：${p}（プッシュ配信は未設定）`};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
