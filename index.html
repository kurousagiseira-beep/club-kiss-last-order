<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>CLUB KISS | LAST ORDER</title><style>body{margin:0;background:#0b1020;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:540px;margin:auto;padding:22px 16px 80px}h1{margin:0;font-size:26px}.muted{color:#a5afc4;font-size:13px}section{background:#192238;border-radius:18px;padding:16px;margin-top:16px}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{border:1px solid #45516c;background:#27334b;color:white;padding:12px 8px;border-radius:10px;font-size:15px;cursor:pointer}.selected,.primary{background:#2563eb;border-color:#2563eb}.wide{width:100%;margin-top:12px}.wheel{height:160px;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;border-radius:12px;background:#10182b;text-align:center}.wheel div{height:48px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center}.wheel:before,.wheel:after{content:'';display:block;height:56px}.product{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #39435a;padding:10px 0}.product span{flex:1}.qty{min-width:22px;text-align:center}dialog{background:#192238;color:white;border:1px solid #56627a;border-radius:18px;max-width:90%;width:400px}pre{white-space:pre-wrap;font:inherit;line-height:1.7}.history{border-bottom:1px solid #39435a;padding:12px 0}.row{display:flex;gap:8px}.row button{flex:1}small{color:#cbd5e1}</style></head><body><main><h1>CLUB KISS</h1><div class="muted">LAST ORDER MANAGEMENT / 試作版</div><section><h2>① 卓番号</h2><div class="grid" id="tables"></div></section><section><h2>② 担当者（上下スクロール）</h2><div class="wheel" id="wheel"></div><p class="muted">選択中：<strong id="staffName">代表</strong></p></section><section><h2>③ 注文品</h2><div id="products"></div></section><section><h2>注文確認</h2><div id="cart"></div><button class="wide primary" id="review">内容確認へ</button></section><section><h2>受信・送信履歴（この端末）</h2><div id="history"></div></section><section><h2>通知設定</h2><p class="muted">プッシュ通知はFirebase・通知配信サーバーの設定後に利用できます。この試作版ではまだ外部端末に送信されません。</p><button class="wide" id="notify">通知の許可を確認</button><p id="notifyStatus" class="muted"></p></section></main><dialog id="dialog"><h2>送信前の最終確認</h2><pre id="summary"></pre><div class="row"><button id="cancel">戻る</button><button class="primary" id="send">確定して登録</button></div></dialog><script>
const tables=['2','3','4','5','6','7','8','9','VIP1','VIP2','VIP3'];const staff=['代表','輝','京磨','ローザ','結希','ハウル','ルパン','しゅう','流川','れもん'];const products=['アンジュエール 白','アンジュエール ロゼ','アンジュエール ゴールド','ビール','コーラ','緑茶','ウーロン茶','テキーラ','コカレロ'];let table='2',person='代表',counts={},history=JSON.parse(localStorage.getItem('kiss-lo-orders')||'[]');const $=id=>document.getElementById(id);function el(tag,txt,cl){let e=document.createElement(tag);e.textContent=txt;if(cl)e.className=cl;return e}function drawTables(){ $('tables').replaceChildren(...tables.map(t=>{let b=el('button',t,t===table?'selected':'');b.onclick=()=>{table=t;drawTables()};return b}))}drawTables();const wheel=$('wheel');staff.forEach(s=>wheel.append(el('div',s)));let wheelTimer;wheel.addEventListener('scroll',()=>{clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{let i=Math.max(0,Math.min(staff.length-1,Math.round(wheel.scrollTop/48)));person=staff[i];$('staffName').textContent=person},80)});function drawProducts(){$('products').replaceChildren(...products.map(p=>{let r=el('div','','product'),name=el('span',p),minus=el('button','−'),n=el('b',String(counts[p]||0),'qty'),plus=el('button','＋');minus.onclick=()=>{counts[p]=Math.max(0,(counts[p]||0)-1);drawProducts();drawCart()};plus.onclick=()=>{counts[p]=(counts[p]||0)+1;drawProducts();drawCart()};r.append(name,minus,n,plus);return r}))}function lines(){return products.filter(p=>counts[p]>0).map(p=>`${p} × ${counts[p]}`)}function drawCart(){$('cart').textContent=lines().join(' / ')||'注文品を選んでください'}function drawHistory(){$('history').replaceChildren(...history.map(o=>{let d=el('div','','history'),head=el('strong',`${o.table}卓｜${o.staff}`),p=el('pre',o.items.join('\n')),date=el('small',o.date),status=el('small',o.checked?'確認済':'未確認'),b=el('button',o.checked?'未確認に戻す':'確認済みにする');b.onclick=()=>{o.checked=!o.checked;persist()};d.append(head,p,date,document.createElement('br'),status,document.createElement('br'),b);return d}));if(!history.length)$('history').textContent='履歴はありません'}function persist(){localStorage.setItem('kiss-lo-orders',JSON.stringify(history));drawHistory()}drawProducts();drawCart();drawHistory();$('review').onclick=()=>{if(!lines().length){alert('商品を選択してください');return}$('summary').textContent=`卓番号：${table}\n担当：${person}\n\n${lines().join('\n')}`;$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('send').onclick=()=>{history.unshift({id:Date.now(),table,staff:person,items:lines(),date:new Date().toLocaleString('ja-JP'),checked:false});persist();counts={};drawProducts();drawCart();$('dialog').close();alert('この端末に登録しました。外部通知はまだ送信されていません。')};$('notify').onclick=async()=>{if(!('Notification'in window)){$('notifyStatus').textContent='この環境では通知に対応していません';return}let p=await Notification.requestPermission();$('notifyStatus').textContent=`通知の許可：${p}（プッシュ配信は未設定）`};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
